{% extends 'base.html' %}

{% block title %}Confirm Delete Prescription{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-6 mx-auto">
        <div class="card">
            <div class="card-header">
                <h5 class="mb-0">Confirm Delete Prescription</h5>
            </div>
            <div class="card-body">
                <p>Are you sure you want to delete this prescription for <strong>{{ customer.name }}</strong>?</p>
                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex justify-content-between">
                        <a href="{% url 'accounts:prescription_detail' customer_pk=customer.pk pk=prescription.pk %}" class="btn btn-secondary">
                            <i class="fas fa-arrow-left"></i> Cancel
                        </a>
                        <button type="submit" class="btn btn-danger">
                            <i class="fas fa-trash"></i> Delete
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
